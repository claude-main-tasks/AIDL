name: build-aidl
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y git g++ bison flex make pkg-config \
            android-libbase-dev android-liblog-dev libgtest-dev
      - name: Clone aidl android-17.0.0_r1
        run: git clone --depth=1 --branch android-17.0.0_r1 https://android.googlesource.com/platform/system/tools/aidl src
      - name: Build
        working-directory: src
        run: |
          set -ex
          bison -d -o aidl_language_y.cpp aidl_language_y.yy
          flex -o aidl_language_l.cpp aidl_language_l.ll
          SRCS="aidl_checkapi aidl_const_expressions aidl_dumpapi aidl_language aidl_language_y aidl_language_l aidl_to_common aidl_to_cpp_common aidl_to_cpp aidl_to_java aidl_to_ndk aidl_to_rust aidl_typenames aidl ast_java check_valid code_writer comments diagnostics generate_aidl_mappings generate_cpp generate_cpp_analyzer generate_java_binder generate_java generate_ndk generate_rust import_resolver io_delegate location logging options parser permission preprocess main"
          for s in $SRCS; do g++ -std=c++20 -O2 -DPLATFORM_SDK_VERSION=37 -I. -Iinclude -I/usr/include/android -c $s.cpp -o $s.o; done
          g++ -o aidl *.o -lbase -llog -lpthread
          ./aidl --help || true
          ldd aidl
      - uses: actions/upload-artifact@v4
        with: { name: aidl-aarch64, path: src/aidl }
